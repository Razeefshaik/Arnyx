spring.application.name=arnyx
server.address=127.0.0.1
server.port=${ARNYX_PORT:4318}
server.shutdown=graceful
spring.threads.virtual.enabled=true
spring.datasource.url=jdbc:h2:file:${ARNYX_DATA_DIR:../.arnyx}/database;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.web.resources.static-locations=file:../dist/
spring.mvc.async.request-timeout=240000
arnyx.root=${ARNYX_ROOT:..}
arnyx.codex-bin=${CODEX_BIN:}
logging.level.root=INFO
server.error.include-message=never
